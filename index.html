<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<meta name="description" content="크로스핏 WOD 기록과 성장 통계">
<title>WOD Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 글꼴은 비차단 로드: 네트워크가 느려도 앱이 먼저 뜨고, 받은 뒤 Pretendard 로 바뀜 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="tab">
<main id="view"></main>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-dim" data-sheet-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" data-sheet-close aria-label="닫기">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <input id="sheet-q" class="sheet-q" placeholder="검색">
    <div id="sheet-list" class="sheet-list"></div>
    <div id="sheet-body" class="sheet-body" hidden></div>
  </div>
</div>
<nav class="tabbar">
  <a href="#/" data-nav="">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>오늘</span>
  </a>
  <a href="#/log" data-nav="log">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>기록</span>
  </a>
  <a href="#/new" data-nav="new" class="plus" aria-label="입력">
    <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></i>
    <span>입력</span>
  </a>
  <a href="#/stats" data-nav="stats">
    <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>성장</span>
  </a>
  <a href="#/me" data-nav="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>내 정보</span>
  </a>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
