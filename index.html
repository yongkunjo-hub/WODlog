<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<meta name="description" content="크로스핏 WOD 기록과 성장 통계">
<title>WOD Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 글꼴은 비차단 로드: 네트워크가 느려도 앱이 먼저 뜨고, 받은 뒤 Pretendard 로 바뀜 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="tab">
<main id="view"></main>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-dim" data-sheet-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" data-sheet-close aria-label="닫기">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <input id="sheet-q" class="sheet-q" placeholder="검색">
    <div id="sheet-list" class="sheet-list"></div>
  </div>
</div>
<nav class="tabbar">
  <a href="#/" data-nav="">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>기록</span>
  </a>
  <a href="#/new" data-nav="new" class="plus" aria-label="입력">
    <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></i>
    <span>입력</span>
  </a>
  <a href="#/stats" data-nav="stats">
    <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>통계</span>
  </a>
  <a href="#/settings" data-nav="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>설정</span>
  </a>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
